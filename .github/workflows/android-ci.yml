name: Android CI / Release

on:
  push:
    branches: [ main, master, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            mkdir -p keystore
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > keystore/release.jks
            echo "Keystore decoded successfully"
          else
            echo "No RELEASE_KEYSTORE_BASE64 secret – release builds will be unsigned"
          fi

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build release APK (signed when secrets present)
        env:
          RELEASE_KEYSTORE_PATH: keystore/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -f keystore/release.jks ] && [ -n "$RELEASE_KEYSTORE_PASSWORD" ]; then
            echo "Building signed release APK..."
            ./gradlew assembleRelease --stacktrace
          else
            echo "Building unsigned release APK (no keystore secrets)..."
            ./gradlew assembleRelease -x packageRelease || ./gradlew assembleRelease --stacktrace || true
          fi

      - name: Build release AAB (signed when secrets present)
        env:
          RELEASE_KEYSTORE_PATH: keystore/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -f keystore/release.jks ] && [ -n "$RELEASE_KEYSTORE_PASSWORD" ]; then
            ./gradlew bundleRelease --stacktrace
          else
            echo "Skipping AAB – no signing secrets"
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: studeco-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: studeco-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: studeco-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            studeco-debug-apk/*
            studeco-release-apk/*
            studeco-release-aab/*
          generate_release_notes: true
          fail_on_unmatched_files: false
